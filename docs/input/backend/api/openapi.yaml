              - triggerType
              - triggerKey
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      sessionId:
                        type: string
                        format: uuid
                      triggerType:
                        type: string
                        enum:
                        - message_count
                        - inactivity
                      triggerKey:
                        type: string
                      status:
                        type: string
                        enum:
                        - generating
                        - ready
                        - failed
                        - dismissed
                      content:
                        type: string
                        nullable: true
                      errorCode:
                        type: string
                        enum:
                        - AUTH_EXPIRED
                        - AUTH_INVALID
                        - NETWORK_TIMEOUT
                        - NETWORK_OFFLINE
                        - VALIDATION_ERROR
                        - PII_CHECK_FAILED
                        - EMBEDDING_FAILED
                        - AI_GENERATION_TIMEOUT
                        - NOT_FOUND
                        - RATE_LIMITED
                        - EXPORT_EMPTY_PERIOD
                        - PAYLOAD_TOO_LARGE
                        - OCR_NO_TEXT
                        nullable: true
                      dismissedAt:
                        type: string
                        format: date-time
                        nullable: true
                      createdAt:
                        type: string
                        format: date-time
                    required:
