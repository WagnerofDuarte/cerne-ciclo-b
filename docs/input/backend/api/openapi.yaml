                - data
                - meta
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /chat/sessions/{id}/messages:
    get:
      operationId: chat.messages.list
      summary: List the messages of a session, ordered by seq
      security:
      - bearerAuth: []
      x-cerne-function: chat-messages-list
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        sessionId:
                          type: string
                          format: uuid
                        role:
                          type: string
                          enum:
                          - user
                          - assistant
                        content:
                          type: string
                        seq:
                          type: integer
                          minimum: 0
                        status:
                          type: string
                          enum:
                          - streaming
                          - complete
                          - failed
                        retryCount:
                          type: integer
                          minimum: 0
                        createdAt:
                          type: string
                          format: date-time
                      required:
                      - id
                      - sessionId
                      - role
                      - content
                      - seq
                      - status
                      - retryCount
                      - createdAt
                  meta:
                    type: object
                    additionalProperties: {}
                required:
                - data
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: chat.messages.send
      summary: Send message — streaming SSE response
      security:
      - bearerAuth: []
      x-cerne-function: chat-messages-send
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 8000
              required:
              - content
