  /account:
    delete:
      operationId: account.delete
      summary: Hard delete, cascading, including purge of the exports bucket
      security:
      - bearerAuth: []
      x-cerne-function: account-delete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmation:
                  type: string
                  enum:
                  - DELETE
              required:
              - confirmation
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        enum:
                        - true
                    required:
                    - ok
                  meta:
                    type: object
                    additionalProperties: {}
                required:
                - data
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          enum:
          - AUTH_EXPIRED
          - AUTH_INVALID
          - NETWORK_TIMEOUT
          - NETWORK_OFFLINE
          - VALIDATION_ERROR
          - PII_CHECK_FAILED
          - EMBEDDING_FAILED
          - AI_GENERATION_TIMEOUT
          - NOT_FOUND
          - RATE_LIMITED
          - EXPORT_EMPTY_PERIOD
          - PAYLOAD_TOO_LARGE
          - OCR_NO_TEXT
        message:
          type: string
        retryable:
          type: boolean
        requestId:
          type: string
      required:
      - code
      - message
      - retryable
      - requestId
