      security:
      - bearerAuth: []
      x-cerne-function: chat-insight-create
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
